name: ROZZA
options:
  bundleIdPrefix: com.rozza
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.10
    MARKETING_VERSION: 4.0.2
    CURRENT_PROJECT_VERSION: 22
targets:
  ROZZA:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources/Localization
        buildPhase: resources
      - path: Resources/Assets.xcassets
        buildPhase: resources
      - path: rozza2.html
        buildPhase: resources
      - path: Resources/yt_video_play_messenger.js
        buildPhase: resources
      - path: Resources/yt_background_bridge.js
        buildPhase: resources
    entitlements:
      path: Resources/ROZZA.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rozza.app
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: ROZZA
        CODE_SIGN_STYLE: Automatic
    dependencies: []
  ROZZATests:
    type: bundle.unit-test
    platform: iOS
    sources: [tests]
    dependencies:
      - target: ROZZA
