name: ROZZA
options:
  bundleIdPrefix: com.rozza
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.10
targets:
  ROZZA:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources/Localization
        buildPhase: resources
      - path: Resources/Assets.xcassets
        buildPhase: resources
    info:
      path: Resources/Info.plist
    entitlements:
      path: Resources/ROZZA.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rozza.app
        ROZZA_API_BASE_URL: "http://127.0.0.1:3001"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: ROZZA
        CODE_SIGN_STYLE: Automatic
    dependencies: []
  ROZZATests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: ROZZA
