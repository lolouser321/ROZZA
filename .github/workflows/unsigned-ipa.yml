name: Unsigned iOS IPA

on:
  push:
    branches: [main, agent/unsigned-ipa]
  workflow_dispatch:

jobs:
  build-unsigned-ipa:
    name: Build unsigned device IPA
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Xcode project
        run: |
          xcodebuild -version
          brew install xcodegen
          xcodegen generate

      - name: Build unsigned iPhone application
        run: |
          set -o pipefail
          xcodebuild -project ROZZA.xcodeproj -scheme ROZZA \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build

      - name: Package unsigned IPA
        run: |
          APP_PATH=$(find DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -n 1)
          test -n "$APP_PATH"
          test -f "$APP_PATH/Info.plist"
          test -d "$APP_PATH/Assets.car" || test -f "$APP_PATH/Assets.car"
          mkdir -p Payload
          ditto "$APP_PATH" "Payload/ROZZA.app"
          ditto -c -k --sequesterRsrc --keepParent Payload ROZZA-Unsigned.ipa
          ls -lh ROZZA-Unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: ROZZA-Unsigned-IPA
          path: ROZZA-Unsigned.ipa
          retention-days: 30

