name: Build ROZZA iOS IPA

on:
  workflow_dispatch:
  push:
    paths:
      - "Sources/**"
      - "Resources/**"
      - "Scripts/**"
      - "rozza2.html"
      - "project.yml"
      - ".github/workflows/ios-ipa.yml"

jobs:
  unsigned-ipa:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build and validate unsigned IPA
        run: |
          chmod +x Scripts/build-unsigned-ipa.sh Scripts/verify-ios-resources.sh
          ./Scripts/build-unsigned-ipa.sh

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ROZZA-4.1.0-Build26-unsigned-ipa
          path: build/ROZZA-Unsigned.ipa
          if-no-files-found: error
