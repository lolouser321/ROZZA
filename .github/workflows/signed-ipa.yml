name: Signed IPA (physical iPhone)

on:
  workflow_dispatch:
    inputs:
      export_method:
        description: Export method matching the provisioning profile
        required: true
        default: ad-hoc
        type: choice
        options: [ad-hoc, development, app-store]

jobs:
  build-ipa:
    runs-on: macos-15
    env:
      TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
      BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
      ROZZA_API_BASE_URL: ${{ vars.ROZZA_API_BASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate required signing secrets
        env:
          P12: ${{ secrets.IOS_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          for name in P12 P12_PASSWORD PROFILE KEYCHAIN_PASSWORD TEAM_ID BUNDLE_ID; do
            test -n "${!name}" || { echo "Missing required secret: $name"; exit 1; }
          done

      - name: Generate Xcode project
        run: |
          xcodebuild -version
          brew install xcodegen
          xcodegen generate

      - name: Decode signing assets and read profile
        env:
          P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          mkdir -p .ci "$HOME/Library/MobileDevice/Provisioning Profiles"
          printf '%s' "$P12_BASE64" | base64 --decode > .ci/dist.p12
          printf '%s' "$PROFILE_BASE64" | base64 --decode > .ci/profile.mobileprovision
          security cms -D -i .ci/profile.mobileprovision > .ci/profile.plist
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' .ci/profile.plist)
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' .ci/profile.plist)
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          cp .ci/profile.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

      - name: Import certificate into temporary keychain
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/rozza.keychain-db"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import .ci/dist.p12 -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

      - name: Generate export options
        run: |
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>${{ inputs.export_method }}</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key><dict>
              <key>$BUNDLE_ID</key><string>$PROFILE_NAME</string>
            </dict>
          </dict></plist>
          EOF

      - name: Archive and export signed IPA
        run: |
          set -o pipefail
          xcodebuild -project ROZZA.xcodeproj -scheme ROZZA \
            -configuration Release -archivePath ROZZA.xcarchive \
            -destination 'generic/platform=iOS' \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            ROZZA_API_BASE_URL="$ROZZA_API_BASE_URL" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" archive
          xcodebuild -exportArchive -archivePath ROZZA.xcarchive \
            -exportOptionsPlist ExportOptions.plist -exportPath export
          mv export/*.ipa ROZZA-iPhone-Signed.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: ROZZA-iPhone-Signed.ipa
          path: ROZZA-iPhone-Signed.ipa
          retention-days: 30

      - name: Remove temporary signing assets
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN_PATH" || true
          rm -rf .ci ExportOptions.plist
