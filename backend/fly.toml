# ROZZA backend on Fly.io. Rename `app` before the first deploy.
# Secrets are set with `fly secrets set`, never committed here.

app = "rozza-backend"
primary_region = "cdg"   # closest Fly region to Egypt; see `fly platform regions`

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3001"
  HOST = "0.0.0.0"
  ROZZA_DATA_DIR = "/data"

# The catalog and search cache survive redeploys here. Create it once with:
#   fly volumes create rozza_data --size 1 --region cdg
[mounts]
  source = "rozza_data"
  destination = "/data"

[http_service]
  internal_port = 3001
  force_https = true
  # Keep one machine warm: a cold start on the first search reads as the app
  # being broken, and the catalog DB is cheap to hold open.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.http_options.response]
    pristine = true

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
